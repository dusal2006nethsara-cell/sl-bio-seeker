name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Initialize Project and Build APK & AAB
        run: |
          cordova create tempcom com.bioseeker.app BioSeeker
          cp -r www/* tempcom/www/
          cd tempcom
          cordova platform add android
          cordova build android --release -- --apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BioSeeker-Android-App
          path: tempcom/platforms/android/app/build/outputs/
          path: app-release.apk
